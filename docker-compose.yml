services:
  cms_ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Relative, not the tailscale API host:port directly - this keeps the UI and
        # API on the same origin in production (proxied by this container's own
        # nginx, see nginx.conf), which is what makes the session-cookie auth work
        # with plain SameSite=Lax and no cross-origin cookie complexity.
        - NUXT_PUBLIC_API_BASE_URL=/api/v1/
        - NUXT_PUBLIC_APP_URL=
    container_name: cms_ui
    restart: always
    ports:
      - "7001:80" # Maps your host port 7000 to Nginx port 80
    networks:
      - homelab_web

networks:
  homelab_web:
    external: true
